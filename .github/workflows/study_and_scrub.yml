name: JevAds Google Ads Study & Scrub

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Google Ads Customer ID (CID, e.g. 123-456-7890)'
        required: true
        type: string
      action:
        description: 'Action to perform'
        required: true
        default: 'study_and_scrub'
        type: choice
        options:
          - 'study_only'
          - 'study_and_scrub'
      days:
        description: 'Days of search terms to analyze'
        required: false
        default: '30'
        type: string

jobs:
  run-scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-ads pydantic httpx

      - name: Run Google Ads Study & Jev Scrub
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          TARGET_CUSTOMER_ID: ${{ inputs.customer_id }}
          DAYS_BACK: ${{ inputs.days }}
          ACTION_MODE: ${{ inputs.action }}
        run: |
          python cli_pipeline.py

      - name: Upload Report & Negatives CSV
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-scrub-report-${{ inputs.customer_id }}
          path: output/
