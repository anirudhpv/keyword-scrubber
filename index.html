<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>JevAds — Google Ads React Flow Hierarchy & Negatives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & Babel for Standalone React Flow Execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-page: #fbf9f5;
            --bg-surface: #ffffff;
            --bg-subtle: #f4f0e6;
            --bg-muted: #eae3d2;
            
            --ink-primary: #181715;
            --ink-secondary: #57534e;
            --ink-muted: #857f77;
            --ink-faint: #b8b2a7;
            
            --brand-green: #1b4332;
            --brand-green-light: #e8f3ed;
            --brand-green-border: #b7dfc8;
            --brand-forest: #2d6a4f;
            --brand-amber: #d97706;
            --brand-amber-light: #fef3c7;
            --brand-red: #991b1b;
            --brand-red-light: #fef2f2;
            --brand-blue: #1e40af;
            --brand-blue-light: #eff6ff;
            
            --border-subtle: #e7e2d8;
            --border-strong: #d5cebf;
            
            --font-serif: 'Fraunces', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--ink-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header.top-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 24px;
            z-index: 100;
            flex-shrink: 0;
        }
        .header-inner {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-monogram {
            width: 34px;
            height: 34px;
            background: var(--brand-green);
            color: #ffffff;
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .brand-title h1 {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ink-primary);
            line-height: 1.1;
        }
        .brand-title p {
            font-size: 0.68rem;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        /* Flow Canvas Container */
        #flow-root {
            flex: 1;
            position: relative;
            background: #fbf9f5;
            background-image: radial-gradient(#e5dfd3 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: auto;
            padding: 40px;
        }

        .btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            color: var(--ink-primary);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .btn:hover {
            border-color: var(--brand-green);
            color: var(--brand-green);
            background: var(--bg-subtle);
        }
        .btn-primary {
            background: var(--brand-green);
            border-color: var(--brand-green);
            color: #ffffff;
        }
        .btn-primary:hover {
            background: var(--brand-forest);
            color: #ffffff;
        }

        /* ================= REACT FLOW NODES STYLES ================= */
        .node-account-card {
            background: #ffffff;
            border: 2px solid var(--brand-green);
            border-radius: 12px;
            padding: 18px 22px;
            box-shadow: 0 4px 14px rgba(27, 67, 50, 0.08);
            min-width: 320px;
            max-width: 360px;
            transition: transform 0.2s;
        }
        .node-account-title {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--brand-green);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .node-campaign-card {
            background: #ffffff;
            border: 1.5px solid var(--border-strong);
            border-radius: 10px;
            padding: 16px 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            min-width: 300px;
            max-width: 340px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .node-campaign-card:hover {
            border-color: var(--brand-green);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        .node-adgroup-card {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            min-width: 260px;
            max-width: 290px;
        }

        /* Clickable Pill Badges */
        .pill-btn {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            user-select: none;
            transition: all 0.15s ease;
        }
        .pill-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .pill-shared { background: var(--brand-blue-light); color: var(--brand-blue); border: 1px solid #bfdbfe; }
        .pill-camp-neg { background: var(--brand-red-light); color: var(--brand-red); border: 1px solid #fecaca; }
        .pill-ag-neg { background: var(--brand-amber-light); color: var(--brand-amber); border: 1px solid #fde68a; }
        .pill-expand { background: var(--brand-green-light); color: var(--brand-green); border: 1px solid var(--brand-green-border); }

        /* Slide-over Inspection Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(24, 23, 21, 0.4);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: none;
            justify-content: flex-end;
        }
        .drawer-overlay.active { display: flex; }
        .drawer-panel {
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            height: 100%;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .drawer-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-subtle);
        }
        .drawer-title { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700; }
        .drawer-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--ink-muted); }
        .drawer-content { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }

        .drawer-row {
            padding: 10px 14px;
            background: var(--bg-subtle);
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.84rem;
        }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="header-inner">
        <div class="brand-block">
            <div class="brand-monogram">J</div>
            <div class="brand-title">
                <h1>JevAds Flow</h1>
                <p>Google Ads Interactive Hierarchy & Negative Architecture</p>
            </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn" onclick="document.getElementById('file-upload').click()">📂 Load Blueprint JSON</button>
            <input type="file" id="file-upload" style="display: none;" accept=".json" onchange="handleFile(event)">
        </div>
    </div>
</header>

<div id="flow-root"></div>

<!-- Slide-over Drawer -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer(event)">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <div class="drawer-header">
            <div>
                <h3 class="drawer-title" id="drawer-title">Inspection Details</h3>
                <span style="font-size: 0.72rem; font-weight: 700; color: var(--ink-muted); text-transform: uppercase;" id="drawer-subtitle">Negatives</span>
            </div>
            <button class="drawer-close" onclick="closeDrawer()">✕</button>
        </div>
        <div class="drawer-content" id="drawer-body"></div>
    </div>
</div>

<script type="text/babel">
    const { useState, useEffect } = React;

    function FlowApp() {
        const [blueprint, setBlueprint] = useState(null);
        const [expandedCamps, setExpandedCamps] = useState({});

        useEffect(() => {
            window.loadBlueprintData = (data) => {
                setBlueprint(data.data || data);
            };
        }, []);

        if (!blueprint) {
            return (
                <div style={{ textAlign: "center", padding: "80px 20px", color: "var(--ink-muted)" }}>
                    <div style={{ fontSize: "2rem", marginBottom: "12px" }}>🌳</div>
                    <h3 style={{ fontFamily: "var(--font-serif)", fontSize: "1.4rem", color: "var(--ink-primary)", marginBottom: "6px" }}>
                        Google Ads Hierarchy Tree
                    </h3>
                    <p style={{ maxWidth: "480px", margin: "0 auto 20px auto", fontSize: "0.9rem" }}>
                        Click <strong>"Load Blueprint JSON"</strong> above to explore your campaigns, negative lists, and ad group sculpting flow.
                    </p>
                </div>
            );
        }

        const camps = blueprint.campaigns || [];
        const ags = blueprint.ad_groups || [];
        const shared = blueprint.shared_lists || [];
        const campNegs = blueprint.campaign_negatives || [];
        const agNegs = blueprint.adgroup_negatives || [];

        // Grouping
        const agsByCamp = {};
        ags.forEach(a => {
            if (!agsByCamp[a.campaign_name]) agsByCamp[a.campaign_name] = [];
            agsByCamp[a.campaign_name].push(a);
        });

        const campNegsByCamp = {};
        campNegs.forEach(cn => {
            if (!campNegsByCamp[cn.campaign_name]) campNegsByCamp[cn.campaign_name] = [];
            campNegsByCamp[cn.campaign_name].push(cn);
        });

        const agNegsByAg = {};
        agNegs.forEach(an => {
            const key = `${an.campaign_name}::${an.ad_group_name}`;
            if (!agNegsByAg[key]) agNegsByAg[key] = [];
            agNegsByAg[key].push(an);
        });

        const sharedByCamp = {};
        shared.forEach(sl => {
            (sl.applied_campaigns || []).forEach(ac => {
                if (!sharedByCamp[ac.campaign_name]) sharedByCamp[ac.campaign_name] = [];
                sharedByCamp[ac.campaign_name].push(sl);
            });
        });

        const toggleCamp = (name) => {
            setExpandedCamps(prev => ({ ...prev, [name]: !prev[name] }));
        };

        return (
            <div style={{ display: "flex", gap: "60px", alignItems: "flex-start", minWidth: "1200px" }}>
                
                {/* 1. ROOT NODE: ACCOUNT */}
                <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                    <div className="node-account-card">
                        <div className="node-account-title">
                            <span>🏢</span>
                            <span>{blueprint.customer_id ? `CID: ${blueprint.customer_id}` : "Account Root"}</span>
                        </div>
                        <p style={{ fontSize: "0.78rem", color: "var(--ink-muted)", marginBottom: "12px" }}>
                            Google Ads Account Level
                        </p>
                        <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                            <span className="pill-btn pill-shared" onClick={() => window.openDrawerRoot('account_shared', shared)}>
                                📋 {shared.length} Shared Lists
                            </span>
                            <span className="pill-btn pill-expand">
                                📁 {camps.length} Campaigns
                            </span>
                        </div>
                    </div>
                </div>

                {/* 2. COLUMN: CAMPAIGNS NODES */}
                <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>
                    {camps.map(c => {
                        const cAgs = agsByCamp[c.name] || [];
                        const cShared = sharedByCamp[c.name] || [];
                        const cNegs = campNegsByCamp[c.name] || [];
                        const isExpanded = Boolean(expandedCamps[c.name]);

                        return (
                            <div key={c.id || c.name} style={{ display: "flex", gap: "50px", alignItems: "center" }}>
                                
                                <div className="node-campaign-card" style={{ borderColor: isExpanded ? "var(--brand-green)" : "var(--border-strong)" }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "4px" }}>
                                        <div style={{ fontWeight: 700, fontSize: "0.98rem", color: "var(--ink-primary)" }}>
                                            📁 {c.name}
                                        </div>
                                    </div>
                                    <div style={{ fontSize: "0.74rem", color: "var(--ink-muted)", marginBottom: "10px" }}>
                                        {c.type} · Budget: <strong style={{ color: "var(--brand-green)" }}>${(c.budget_daily || 0).toFixed(2)}/day</strong>
                                    </div>

                                    <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                                        <span className="pill-btn pill-shared" onClick={() => window.openDrawerRoot('camp_shared', { name: c.name, lists: cShared })}>
                                            📋 {cShared.length} Shared Lists
                                        </span>
                                        <span className="pill-btn pill-camp-neg" onClick={() => window.openDrawerRoot('camp_negs', { name: c.name, negs: cNegs })}>
                                            🚫 {cNegs.length} Negatives
                                        </span>
                                        <span className="pill-btn pill-expand" onClick={() => toggleCamp(c.name)}>
                                            📁 {cAgs.length} Ad Groups {isExpanded ? "◀" : "▶"}
                                        </span>
                                    </div>
                                </div>

                                {/* 3. COLUMN: AD GROUPS (EXPANDED) */}
                                {isExpanded && (
                                    <div style={{ display: "flex", flexDirection: "column", gap: "10px", paddingLeft: "16px", borderLeft: "2px dashed var(--brand-green-border)" }}>
                                        {cAgs.map(ag => {
                                            const agKey = `${c.name}::${ag.name}`;
                                            const localNegs = agNegsByAg[agKey] || [];
                                            return (
                                                <div key={ag.id || ag.name} className="node-adgroup-card">
                                                    <div style={{ fontWeight: 700, fontSize: "0.85rem", color: "var(--ink-primary)", marginBottom: "2px" }}>
                                                        🎯 {ag.name}
                                                    </div>
                                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "6px" }}>
                                                        <span style={{ fontSize: "0.68rem", color: "var(--ink-muted)" }}>{ag.status}</span>
                                                        <span className="pill-btn pill-ag-neg" onClick={() => window.openDrawerRoot('ag_negs', { agKey, negs: localNegs })}>
                                                            🎯 {localNegs.length} Sculpting Negs
                                                        </span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                            </div>
                        );
                    })}
                </div>

            </div>
        );
    }

    ReactDOM.render(<FlowApp />, document.getElementById('flow-root'));

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const data = JSON.parse(evt.target.result);
                window.loadBlueprintData(data);
            } catch(err) {
                alert("Invalid JSON: " + err.message);
            }
        };
        reader.readAsText(file);
    }

    window.openDrawerRoot = (type, data) => {
        const overlay = document.getElementById('drawer-overlay');
        const title = document.getElementById('drawer-title');
        const subtitle = document.getElementById('drawer-subtitle');
        const body = document.getElementById('drawer-body');

        overlay.classList.add('active');

        if (type === 'account_shared') {
            title.textContent = "Account Shared Negative Lists";
            subtitle.textContent = "Shared Library Sets";
            body.innerHTML = data.map(sl => `
                <div class="drawer-row">
                    <div>
                        <strong>📋 ${sl.name}</strong>
                        <div style="font-size: 0.72rem; color: var(--ink-muted);">Applied to ${(sl.applied_campaigns || []).length} campaigns</div>
                    </div>
                    <span style="font-weight: 700; color: var(--brand-red);">${sl.member_count} keywords</span>
                </div>
            `).join('') || '<div>No shared lists.</div>';
        }
        else if (type === 'camp_shared') {
            title.textContent = "Attached Shared Lists";
            subtitle.textContent = data.name;
            body.innerHTML = data.lists.map(sl => `
                <div class="drawer-row">
                    <strong>📋 ${sl.name}</strong>
                    <span>${sl.member_count} keywords</span>
                </div>
            `).join('') || '<div style="color: var(--ink-muted);">No shared lists attached to this campaign.</div>';
        }
        else if (type === 'camp_negs') {
            title.textContent = "Campaign Negative Keywords";
            subtitle.textContent = data.name;
            body.innerHTML = data.negs.map(cn => `
                <div class="drawer-row">
                    <span style="font-family: var(--font-mono); font-weight: 700; color: var(--brand-red);">${cn.keyword}</span>
                    <span style="font-size: 0.68rem; font-weight: 800; background: #ffffff; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border-subtle);">${cn.match_type}</span>
                </div>
            `).join('') || '<div style="color: var(--ink-muted);">No explicit campaign negatives.</div>';
        }
        else if (type === 'ag_negs') {
            title.textContent = "Ad Group Sculpting Negatives";
            subtitle.textContent = data.agKey;
            body.innerHTML = data.negs.map(an => `
                <div class="drawer-row">
                    <span style="font-family: var(--font-mono); font-weight: 700; color: var(--brand-amber);">${an.keyword}</span>
                    <span style="font-size: 0.68rem; font-weight: 800; background: #ffffff; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border-subtle);">${an.match_type}</span>
                </div>
            `).join('') || '<div style="color: var(--ink-muted);">No local sculpting negatives.</div>';
        }
    };

    function closeDrawer() {
        document.getElementById('drawer-overlay').classList.remove('active');
    }
</script>
</body>
</html>
