<style>

/* Hidden state must clear the bottom offset too - translateY alone leaves an

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script type="text/babel">
const {useState,useEffect,useMemo,useCallback}=React;
const KEY="jev_ads_auth_session";

const ACTION_META={
  ADD_TO_SHARED_LIST:{label:"Shared list",cls:"a-shared",rank:1},
  ADD_CAMPAIGN_NEGATIVE:{label:"Campaign neg",cls:"a-camp",rank:2},
  ADD_ADGROUP_NEGATIVE:{label:"Ad group neg",cls:"a-ag",rank:3},
  TIGHTEN_EXISTING:{label:"Tighten existing",cls:"a-tight",rank:4},
  REVIEW:{label:"Review",cls:"a-review",rank:5},
  PROMOTE:{label:"Promote",cls:"a-promote",rank:6},
  ALREADY_COVERED:{label:"Covered",cls:"a-covered",rank:7},
  INSUFFICIENT_DATA:{label:"Low data",cls:"a-none",rank:8},
};
const money=n=>"$"+(n||0).toFixed(2);

function toast(msg,isErr){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast on"+(isErr?" err":"");
  clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",3800);
}

async function post(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const raw=await r.text();
  let d=null; try{ d=JSON.parse(raw); }catch(e){}
  if(!r.ok){
    const det=d&&d.detail;
    let msg;
    if(typeof det==="string") msg=det;
    else if(det&&det.error) msg=det.error+(det.ref?` [ref ${det.ref}]`:"");
    else if(Array.isArray(det)&&det.length) msg=det.map(x=>`${(x.loc||[]).slice(-1)}: ${x.msg}`).join("; ");
    // Never surface "{}" — fall back to the status line and the raw body.
    else msg=`HTTP ${r.status} ${r.statusText||""}`.trim()+(raw?` — ${raw.slice(0,200)}`:"");
    const err=new Error(msg); err.status=r.status; err.ref=det&&det.ref;
    throw err;
  }
  return d||{};
}

// ---------- session ----------
function loadSession(){ try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;} }

// ---------- account cache (stale-while-revalidate) ----------
// Keyed per signed-in identity so switching Google accounts never shows the
// previous user's list. Every access is guarded: localStorage throws in
// private windows and when the origin's quota is full.
const ACCT_PREFIX="jev_ads_accounts:";

// The cache is bound to the Google identity that fetched it. Email is the only
// stable identifier here - a display name can change and is not unique - so
// without one we refuse to cache at all rather than risk showing one user the
// accounts belonging to another.
const identity=s=>((s&&s.email)||"").trim().toLowerCase();
const acctKey=s=>ACCT_PREFIX+identity(s);

function readAccounts(s){
  const who=identity(s);
  if(!who) return null;
  try{
    const raw=localStorage.getItem(acctKey(s));
    if(!raw) return null;
    const c=JSON.parse(raw);
    // Belt and braces: the payload records its owner, so even a key collision
    // or a hand-edited entry cannot surface another account's list.
    if(!c||c.owner!==who||!Array.isArray(c.accounts)||!c.accounts.length) return null;
    return c;
  }catch(e){ return null; }
}

function writeAccounts(s,accounts){
  const who=identity(s);
  if(!who) return;
  try{
    localStorage.setItem(acctKey(s),JSON.stringify({owner:who,accounts,cached_at:Date.now()}));
  }catch(e){ /* quota or private mode - the cache is an optimisation, not state */ }
}

function clearAccounts(s){
  const who=identity(s);
  try{ if(who) localStorage.removeItem(acctKey(s)); }catch(e){}
}

// Drop every other identity's cached list, so only the signed-in user's
// accounts are ever present on this device.
function pruneOtherAccounts(s){
  const keep=acctKey(s);
  try{
    Object.keys(localStorage)
      .filter(k=>k.startsWith(ACCT_PREFIX)&&k!==keep)
      .forEach(k=>localStorage.removeItem(k));
  }catch(e){}
}

// Compare on the fields the picker actually renders, so a changed name or a
// new/removed account counts as a change but field reordering does not.
const acctSig=list=>JSON.stringify((list||[])
  .map(a=>[a.id,a.name,a.is_manager?1:0,a.login_customer_id||""])
  .sort((x,y)=>x[0]<y[0]?-1:1));

function ago(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return "just now";
  if(m<60) return `${m}m ago`;
  const h=Math.floor(m/60);
  return h<24?`${h}h ago`:`${Math.floor(h/24)}d ago`;
}

async function ensureFresh(s){
  if(!s) return null;
  if(s.expires_at>Date.now()) return s;
  if(!s.refresh_token) return null;
  try{
    const n=await post("/api/auth/refresh",{refresh_token:s.refresh_token});
    localStorage.setItem(KEY,JSON.stringify(n));
    return n;
  }catch(e){ return null; }
}

// ---------- negatives tab ----------
// Shared by the structure and negatives views so a filter choice carries
// across tabs instead of resetting.
function FilterBar({filters,set,campStatuses,agStatuses,hiddenCamps,hiddenAgs,showEmptyToggle=true}){
  const {campStatus,agStatus,hideEmpty}=filters;
  return (<div className="filters">
    <label className="filt">
      <span>Campaigns</span>
      <select value={campStatus} onChange={e=>set({campStatus:e.target.value})}>
        <option value="ENABLED">Active only</option>
        {campStatuses.filter(s=>s!=="ENABLED").map(s=><option key={s} value={s}>{s.toLowerCase()} only</option>)}
        <option value="ALL">All statuses</option>
      </select>
    </label>
    <label className="filt">
      <span>Ad groups</span>
      <select value={agStatus} onChange={e=>set({agStatus:e.target.value})}>
        <option value="ENABLED">Active only</option>
        {agStatuses.filter(s=>s!=="ENABLED").map(s=><option key={s} value={s}>{s.toLowerCase()} only</option>)}
        <option value="ALL">All statuses</option>
      </select>
    </label>
    {showEmptyToggle&&(
      <label className="filt chk" title="Hide campaigns and ad groups that have no negative keywords">
        <input type="checkbox" checked={hideEmpty} onChange={e=>set({hideEmpty:e.target.checked})}/>
        <span>With negatives only</span>
      </label>)}
    {(hiddenCamps>0||hiddenAgs>0)&&(
      <span className="filt-note">
        {[hiddenCamps&&`${hiddenCamps} campaign${hiddenCamps>1?"s":""}`,
          hiddenAgs&&`${hiddenAgs} ad group${hiddenAgs>1?"s":""}`].filter(Boolean).join(" · ")} hidden
      </span>)}
  </div>);
}

// ---------- account structure (read-only canvas tree) ----------
const NODE_W={acct:230,camp:272,ag:244};
const COL_X={acct:0,camp:360,ag:720};
const ROW_H=70, GAP=26;

function StructureTab({data,filters,setFilters,query}){
  const {campStatus,agStatus}=filters;
  const [collapsed,setCollapsed]=useState({});
  const [sel,setSel]=useState(null);
  const [view,setView]=useState({x:40,y:20,k:1});
  const drag=React.useRef(null);
  const statusOk=(s,want)=>want==="ALL"||(s||"").toUpperCase()===want;
  const q=query.trim().toLowerCase();

  const allCamps=data.campaigns||[], allAgs=data.ad_groups||[];
  const campStatuses=useMemo(()=>[...new Set(allCamps.map(c=>(c.status||"").toUpperCase()))].filter(Boolean).sort(),[allCamps]);
  const agStatuses=useMemo(()=>[...new Set(allAgs.map(a=>(a.status||"").toUpperCase()))].filter(Boolean).sort(),[allAgs]);

  // Negative counts per entity, so each node can show what it carries.
  const negCount=useMemo(()=>{
    const camp={},ag={},listsFor={};
    (data.campaign_negatives||[]).forEach(n=>camp[n.campaign_id]=(camp[n.campaign_id]||0)+1);
    (data.adgroup_negatives||[]).forEach(n=>ag[n.ad_group_id]=(ag[n.ad_group_id]||0)+1);
    (data.shared_lists||[]).forEach(l=>(l.applied_campaigns||[]).forEach(c=>{
      (listsFor[c.campaign_id]=listsFor[c.campaign_id]||[]).push(l);
    }));
    return {camp,ag,listsFor};
  },[data]);

  // Tidy layout: place ad groups on sequential rows, centre each campaign on
  // its children, then centre the account on the campaigns.
  const {nodes,edges,height}=useMemo(()=>{
    const camps=allCamps.filter(c=>statusOk(c.status,campStatus))
      .filter(c=>!q||c.name.toLowerCase().includes(q));
    const byCamp={};
    allAgs.filter(a=>statusOk(a.status,agStatus)).forEach(a=>{
      (byCamp[a.campaign_id]=byCamp[a.campaign_id]||[]).push(a);
    });

    const nodes=[],edges=[];
    let row=0;
    const campNodes=[];
    camps.forEach(c=>{
      const kids=collapsed[c.id]?[]:(byCamp[c.id]||[]);
      const startRow=row;
      const agNodes=kids.map(a=>{
        const n={kind:"ag",id:a.id,data:a,x:COL_X.ag,y:row*(ROW_H+GAP),w:NODE_W.ag};
        row++; return n;
      });
      if(!agNodes.length) row++;                       // leaf campaign still takes a row
      const top=startRow*(ROW_H+GAP);
      const bottom=(row-1)*(ROW_H+GAP);
      const cy=(top+bottom)/2;
      const cNode={kind:"camp",id:c.id,data:c,x:COL_X.camp,y:cy,w:NODE_W.camp,
                   childCount:(byCamp[c.id]||[]).length};
      campNodes.push(cNode); nodes.push(cNode);
      agNodes.forEach(n=>{ nodes.push(n); edges.push([cNode,n]); });
    });

    const ay=campNodes.length?(campNodes[0].y+campNodes[campNodes.length-1].y)/2:0;
    const aNode={kind:"acct",id:"__acct",data:{},x:COL_X.acct,y:ay,w:NODE_W.acct};
    nodes.push(aNode);
    campNodes.forEach(n=>edges.push([aNode,n]));
    return {nodes,edges,height:Math.max(row,1)*(ROW_H+GAP)+40};
  },[allCamps,allAgs,campStatus,agStatus,collapsed,q]);

  const onDown=e=>{ drag.current={sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y}; };
  const onMove=e=>{
    if(!drag.current) return;
    setView(v=>({...v,x:drag.current.ox+(e.clientX-drag.current.sx),
                       y:drag.current.oy+(e.clientY-drag.current.sy)}));
  };
  const onUp=()=>{ drag.current=null; };
  const zoom=d=>setView(v=>({...v,k:Math.min(1.6,Math.max(0.35,+(v.k+d).toFixed(2)))}));
  const reset=()=>setView({x:40,y:20,k:1});

  const hiddenCamps=allCamps.length-allCamps.filter(c=>statusOk(c.status,campStatus)).length;
  const hiddenAgs=allAgs.length-allAgs.filter(a=>statusOk(a.status,agStatus)).length;
  const shownCamps=nodes.filter(n=>n.kind==="camp").length;
  const shownAgs=nodes.filter(n=>n.kind==="ag").length;

  return (<div>
    <div className="section-head" style={{margin:"0 0 10px"}}>
      <h3 style={{fontFamily:"var(--serif)",fontSize:"1.05rem",margin:0}}>
        Account structure <span className="pill">{shownCamps} campaigns</span>
        <span className="pill">{shownAgs} ad groups</span>
      </h3>
      <FilterBar filters={filters} set={setFilters} campStatuses={campStatuses} agStatuses={agStatuses}
        hiddenCamps={hiddenCamps} hiddenAgs={hiddenAgs} showEmptyToggle={false}/>
    </div>

    <div className="canvas-wrap">
      <div className="canvas-tools">
        <button className="btn" onClick={()=>zoom(-0.15)} title="Zoom out">−</button>
        <span className="zoom-pct">{Math.round(view.k*100)}%</span>
        <button className="btn" onClick={()=>zoom(0.15)} title="Zoom in">+</button>
        <button className="btn" onClick={reset}>Reset</button>
        <button className="btn" onClick={()=>setCollapsed({})}>Expand all</button>
        <button className="btn" onClick={()=>setCollapsed(Object.fromEntries(allCamps.map(c=>[c.id,true])))}>Collapse all</button>
        <span className="filt-note">drag to pan · read-only</span>
      </div>

      <div className="canvas" onMouseDown={onDown} onMouseMove={onMove}
           onMouseUp={onUp} onMouseLeave={onUp}>
        <div className="canvas-inner" style={{transform:`translate(${view.x}px,${view.y}px) scale(${view.k})`}}>
          <svg className="edges" width={COL_X.ag+NODE_W.ag+60} height={height}>
            {edges.map(([p,c],i)=>{
              const x1=p.x+p.w, y1=p.y+ROW_H/2, x2=c.x, y2=c.y+ROW_H/2;
              const mx=(x1+x2)/2;
              return <path key={i} d={`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`}
                           fill="none" stroke="var(--bd-2)" strokeWidth="1.5"/>;
            })}
          </svg>
          {nodes.map(n=>{
            if(n.kind==="acct") return (
              <div key={n.id} className="nd nd-acct" style={{left:n.x,top:n.y,width:n.w}}>
                <div className="nd-k">Account</div>
                <div className="nd-t">{data.customer_id||"Google Ads"}</div>
                <div className="nd-m">
                  <span className="pill">{(data.shared_lists||[]).length} shared lists</span>
                  <span className="pill">{data.total_negatives} negatives</span>
                </div>
              </div>);
            if(n.kind==="camp"){
              const c=n.data, lists=negCount.listsFor[c.id]||[];
              const isCol=!!collapsed[c.id];
              return (
                <div key={n.id} className={"nd nd-camp"+(sel===n.id?" on":"")}
                     style={{left:n.x,top:n.y,width:n.w}} onClick={()=>setSel(sel===n.id?null:n.id)}>
                  <div className="nd-k">
                    Campaign · {c.type}
                    <span className={"dot "+((c.status||"").toUpperCase()==="ENABLED"?"live":"off")}
                          title={c.status}></span>
                  </div>
                  <div className="nd-t">{c.name}</div>
                  <div className="nd-m">
                    <span className="pill">{money(c.budget_daily)}/day</span>
                    {negCount.camp[c.id]>0&&<span className="pill red">{negCount.camp[c.id]} negs</span>}
                    {lists.length>0&&<span className="pill">{lists.length} lists</span>}
                    {n.childCount>0&&(
                      <button className="pill tog" onClick={e=>{e.stopPropagation();
                        setCollapsed(p=>({...p,[c.id]:!p[c.id]}));}}>
                        {isCol?"▸":"▾"} {n.childCount} ad group{n.childCount===1?"":"s"}
                      </button>)}
                  </div>
                </div>);
            }
            const a=n.data;
            return (
              <div key={n.id} className={"nd nd-ag"+(sel===n.id?" on":"")}
                   style={{left:n.x,top:n.y,width:n.w}} onClick={()=>setSel(sel===n.id?null:n.id)}>
                <div className="nd-k">
                  Ad group
                  <span className={"dot "+((a.status||"").toUpperCase()==="ENABLED"?"live":"off")}
                        title={a.status}></span>
                </div>
                <div className="nd-t">{a.name}</div>
                <div className="nd-m">
                  {negCount.ag[a.id]>0
                    ? <span className="pill amber">{negCount.ag[a.id]} sculpting negs</span>
                    : <span className="pill">no negatives</span>}
                </div>
              </div>);
          })}
        </div>
      </div>
    </div>
  </div>);
}

function NegativesTab({data,query,filters,setFilters}){
  const [open,setOpen]=useState({});
  const {campStatus,agStatus,hideEmpty}=filters;
  const q=query.trim().toLowerCase();
  const tog=k=>setOpen(p=>({...p,[k]:!p[k]}));
  const match=t=>!q||(t||"").toLowerCase().includes(q);
  const statusOk=(s,want)=>want==="ALL"||(s||"").toUpperCase()===want;

  const allCamps=data.campaigns||[];
  const allAgs=data.ad_groups||[];
  const camps=allCamps.filter(c=>statusOk(c.status,campStatus));
  const hiddenCamps=allCamps.length-camps.length;
  const hiddenAgs=allAgs.length-allAgs.filter(a=>statusOk(a.status,agStatus)).length;

  // Offer only the statuses this account actually has, so the control never
  // lists an option that would empty the view.
  const campStatuses=useMemo(()=>[...new Set(allCamps.map(c=>(c.status||"").toUpperCase()))].filter(Boolean).sort(),[allCamps]);
  const agStatuses=useMemo(()=>[...new Set(allAgs.map(a=>(a.status||"").toUpperCase()))].filter(Boolean).sort(),[allAgs]);

  const agByCamp=useMemo(()=>{
    const m={}; (data.ad_groups||[]).forEach(a=>{(m[a.campaign_id]=m[a.campaign_id]||[]).push(a)}); return m;
  },[data]);
  const campNegBy=useMemo(()=>{
    const m={}; (data.campaign_negatives||[]).forEach(n=>{(m[n.campaign_id]=m[n.campaign_id]||[]).push(n)}); return m;
  },[data]);
  const agNegBy=useMemo(()=>{
    const m={}; (data.adgroup_negatives||[]).forEach(n=>{(m[n.ad_group_id]=m[n.ad_group_id]||[]).push(n)}); return m;
  },[data]);

  const lists=(data.shared_lists||[]).map(l=>({...l,keywords:l.keywords.filter(k=>match(k.text))}))
    .filter(l=>!q||l.keywords.length||match(l.name));

  return (<div>
    <h3 style={{fontFamily:"var(--serif)",fontSize:"1.05rem",margin:"0 0 10px"}}>
      Shared negative lists <span className="pill">{(data.shared_lists||[]).length}</span>
    </h3>
    {lists.length===0&&<div className="card"><div className="card-b" style={{color:"var(--ink-3)"}}>No shared negative lists{q?" matching this filter":" on this account"}.</div></div>}
    {lists.map(l=>(
      <div className="card" key={l.id}>
        <div className="card-h" onClick={()=>tog("L"+l.id)}>
          <div className="card-t"><span>{open["L"+l.id]?"▾":"▸"}</span>📋 {l.name}</div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <span className="pill">{l.keywords.length} keywords</span>
            <span className="pill">{l.applied_campaigns.length} campaigns</span>
          </div>
        </div>
        {open["L"+l.id]&&<div className="card-b">
          <div style={{marginBottom:10}}>
            {l.keywords.length?l.keywords.map((k,i)=>(
              <span className="kw" key={i}>{k.text}<span className="mt">{k.match_type}</span></span>
            )):<span style={{color:"var(--ink-3)",fontSize:".8rem"}}>Empty list.</span>}
          </div>
          <div style={{fontSize:".72rem",color:"var(--ink-3)",borderTop:"1px solid var(--bd)",paddingTop:8}}>
            <strong>Applied to:</strong> {l.applied_campaigns.length?l.applied_campaigns.map(c=>c.campaign_name).join(" · "):"not attached to any campaign — these keywords block nothing"}
          </div>
        </div>}
      </div>
    ))}

    <div className="section-head">
      <h3 style={{fontFamily:"var(--serif)",fontSize:"1.05rem",margin:0}}>
        Campaigns <span className="pill">{camps.length}{hiddenCamps>0?` of ${allCamps.length}`:""}</span>
      </h3>
      <FilterBar filters={filters} set={setFilters}
        campStatuses={campStatuses} agStatuses={agStatuses}
        hiddenCamps={hiddenCamps} hiddenAgs={hiddenAgs}/>
    </div>
    {camps.length===0&&<div className="card"><div className="card-b" style={{color:"var(--ink-3)"}}>
      No campaigns match this filter{allCamps.length?` — ${allCamps.length} exist at other statuses.`:"."}
    </div></div>}
    {camps.map(c=>{
      const cn=(campNegBy[c.id]||[]).filter(n=>match(n.text));
      const ags=(agByCamp[c.id]||[]).filter(a=>statusOk(a.status,agStatus))
        .filter(a=>!hideEmpty||(agNegBy[a.id]||[]).length);
      const agHits=ags.reduce((s,a)=>s+(agNegBy[a.id]||[]).filter(n=>match(n.text)).length,0);
      if(q&&!cn.length&&!agHits&&!match(c.name)) return null;
      if(hideEmpty&&!cn.length&&!ags.some(a=>(agNegBy[a.id]||[]).length)) return null;
      return (
        <div className="card" key={c.id}>
          <div className="card-h" onClick={()=>tog("C"+c.id)}>
            <div className="card-t"><span>{open["C"+c.id]?"▾":"▸"}</span>📁 {c.name}</div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <span className="pill">{c.status}</span>
              <span className="pill">{money(c.budget_daily)}/day</span>
              <span className="pill">{cn.length} campaign negs</span>
              <span className="pill">{ags.length} ad group{ags.length===1?"":"s"}</span>
            </div>
          </div>
          {open["C"+c.id]&&<div className="card-b">
            <div style={{marginBottom:12}}>
              <div style={{fontSize:".68rem",fontWeight:800,color:"var(--ink-3)",textTransform:"uppercase",marginBottom:6}}>Campaign-level negatives</div>
              {cn.length?cn.map((n,i)=>(<span className="kw amber" key={i}>{n.text}<span className="mt">{n.match_type}</span></span>))
                :<span style={{color:"var(--ink-3)",fontSize:".8rem"}}>None.</span>}
            </div>
            <div style={{fontSize:".68rem",fontWeight:800,color:"var(--ink-3)",textTransform:"uppercase",marginBottom:6}}>
              Ad groups <span className="pill">{ags.length}</span>
              {agStatus!=="ALL"&&<span className="pill">{agStatus.toLowerCase()} only</span>}
            </div>
            {ags.length===0&&<div style={{color:"var(--ink-4)",fontSize:".78rem",paddingBottom:6}}>
              No ad groups at this status.</div>}
            {ags.map(a=>{
              const an=(agNegBy[a.id]||[]).filter(n=>match(n.text));
              if(q&&!an.length&&!match(a.name)) return null;
              return (<div key={a.id} style={{padding:"8px 0",borderTop:"1px solid var(--bd)"}}>
                <div style={{fontWeight:700,fontSize:".83rem",marginBottom:4}}>🎯 {a.name} <span className="pill">{an.length} negs</span></div>
                <div>{an.length?an.map((n,i)=>(<span className="kw blue" key={i}>{n.text}<span className="mt">{n.match_type}</span></span>))
                  :<span style={{color:"var(--ink-4)",fontSize:".76rem"}}>No sculpting negatives.</span>}</div>
              </div>);
            })}
          </div>}
        </div>
      );
    })}
  </div>);
}

// ---------- triage tab ----------
function TriageTab({data,query}){
  const [filter,setFilter]=useState("ACTIONABLE");
  const recs=data.recommendations||[];
  const q=query.trim().toLowerCase();
  const counts=data.summary?.by_action||{};
  const ACTIONABLE=["ADD_TO_SHARED_LIST","ADD_CAMPAIGN_NEGATIVE","ADD_ADGROUP_NEGATIVE","TIGHTEN_EXISTING"];

  const shown=useMemo(()=>recs
    .filter(r=>filter==="ALL"||(filter==="ACTIONABLE"?ACTIONABLE.includes(r.action):r.action===filter))
    .filter(r=>!q||r.term.toLowerCase().includes(q))
    .sort((a,b)=>(ACTION_META[a.action]?.rank||9)-(ACTION_META[b.action]?.rank||9)||b.cost-a.cost),
  [recs,filter,q]);

  const copyAll=()=>{
    const rows=shown.filter(r=>r.suggested_keyword)
      .map(r=>[r.suggested_keyword,r.suggested_match_type,(r.target&&r.target.container_name)||"",r.action].join("\t"));
    if(!rows.length){ toast("Nothing with a suggested keyword in this view",true); return; }
    navigator.clipboard.writeText("Keyword\tMatch type\tDestination\tAction\n"+rows.join("\n"))
      .then(()=>toast(`Copied ${rows.length} negatives to clipboard`))
      .catch(()=>toast("Clipboard blocked by browser",true));
  };

  return (<div>
    <div className="bar-in" style={{marginBottom:14,padding:0}}>
      <select className="sel" value={filter} onChange={e=>setFilter(e.target.value)}>
        <option value="ACTIONABLE">Actionable only ({ACTIONABLE.reduce((s,a)=>s+(counts[a]||0),0)})</option>
        <option value="ALL">All ({recs.length})</option>
        {Object.keys(ACTION_META).map(a=>counts[a]?<option key={a} value={a}>{ACTION_META[a].label} ({counts[a]})</option>:null)}
      </select>
      <button className="btn" onClick={copyAll}>📋 Copy as TSV</button>
      <span className="pill">JEV ran {data.summary?.jev_questions||0} decisions in {data.summary?.jev_latency_ms||0}ms</span>
    </div>

    <div className="card">
      <table>
        <thead><tr>
          <th>Search term</th><th className="num">Cost</th><th className="num">Clicks</th>
          <th className="num">Conv</th><th>Recommendation</th><th>Add as</th><th>Destination</th>
        </tr></thead>
        <tbody>
          {shown.length===0&&<tr><td colSpan="7" style={{textAlign:"center",padding:36,color:"var(--ink-3)"}}>Nothing in this view.</td></tr>}
          {shown.map((r,i)=>{
            const m=ACTION_META[r.action]||{label:r.action,cls:"a-none"};
            return (<tr key={i}>
              <td style={{maxWidth:320}}>
                <div className="term">{r.term}</div>
                <div className="why">{r.reason}</div>
              </td>
              <td className="num" style={{fontWeight:700,color:r.cost>0?"var(--red)":"var(--ink-4)"}}>{money(r.cost)}</td>
              <td className="num">{r.clicks}</td>
              <td className="num" style={{color:r.conversions>0?"var(--green)":"var(--ink-4)",fontWeight:r.conversions>0?700:400}}>{r.conversions}</td>
              <td><span className={"act "+m.cls}>{m.label}</span>
                {r.jev_abstain&&<div style={{fontSize:".62rem",color:"var(--ink-4)",marginTop:3}}>JEV abstained</div>}
                {!r.jev_abstain&&r.confidence>0&&<div style={{fontSize:".62rem",color:"var(--ink-4)",marginTop:3}}>conf {(r.confidence*100).toFixed(0)}%</div>}
              </td>
              <td>{r.suggested_keyword
                ? <span className="kw">{r.suggested_keyword}<span className="mt">{r.suggested_match_type}</span></span>
                : <span style={{color:"var(--ink-4)"}}>—</span>}</td>
              <td style={{fontSize:".76rem"}}>
                {r.target?<span><strong>{r.target.container_name}</strong><div style={{color:"var(--ink-3)",fontSize:".68rem"}}>{(r.target.level||"").replace(/_/g," ").toLowerCase()}</div></span>
                 :r.matched_negative?<span style={{color:"var(--ink-3)"}}>{r.matched_negative.container_name}</span>
                 :<span style={{color:"var(--ink-4)"}}>—</span>}
              </td>
            </tr>);
          })}
        </tbody>
      </table>
    </div>
  </div>);
}

// ---------- app ----------
function App(){
  const [session,setSession]=useState(null);
  const [health,setHealth]=useState(null);
  const [accounts,setAccounts]=useState([]);
  const [cid,setCid]=useState("");
  const [days,setDays]=useState(30);
  const [minClicks,setMinClicks]=useState(2);
  const [tab,setTab]=useState("structure");
  const [data,setData]=useState(null);
  const [busy,setBusy]=useState(false);
  const [query,setQuery]=useState("");
  const [filters,setFiltersRaw]=useState({campStatus:"ENABLED",agStatus:"ENABLED",hideEmpty:false});
  const setFilters=patch=>setFiltersRaw(f=>({...f,...patch}));
  const [refreshing,setRefreshing]=useState(false);
  const [cachedAt,setCachedAt]=useState(0);

  // Prefer a real client account - a manager has no search terms of its own.
  const pickDefault=list=>((list.find(a=>!a.is_manager)||list[0]||{}).id||"");

  useEffect(()=>{
    fetch("/api/health").then(r=>r.json()).then(setHealth).catch(()=>{});
    (async()=>{
      const s=await ensureFresh(loadSession());
      if(s){ setSession(s); loadAccounts(s); }
    })();
  },[]);

  // Paint the cached list immediately, then revalidate in the background and
  // swap in the fresh one only if it actually differs.
  async function loadAccounts(s,{quiet=false}={}){
    pruneOtherAccounts(s);
    const cached=readAccounts(s);
    if(cached){
      setAccounts(cached.accounts);
      setCachedAt(cached.cached_at);
      setCid(prev=>prev||pickDefault(cached.accounts));
      if(!quiet) toast(`${cached.accounts.length} saved accounts · checking for updates…`);
    }

    setRefreshing(true);
    try{
      const d=await post("/api/accounts",{access_token:s.access_token});
      const fresh=d.accounts||[];
      (d.warnings||[]).forEach(w=>console.warn("Account discovery:",w));

      if(!fresh.length){
        if(!cached) toast("No accessible Google Ads accounts for this login",true);
        else toast("Refresh returned no accounts — keeping the saved list",true);
        return;
      }

      writeAccounts(s,fresh);
      setCachedAt(Date.now());

      if(cached && acctSig(cached.accounts)===acctSig(fresh)){
        setAccounts(fresh);                       // same set, refreshed metadata
        return;                                   // nothing worth interrupting for
      }

      setAccounts(fresh);
      // Keep the current selection if it survived the refresh.
      setCid(prev=>(prev&&fresh.some(a=>a.id===prev))?prev:pickDefault(fresh));

      if(!cached) toast(`Loaded ${fresh.length} accessible account${fresh.length>1?"s":""}`);
      else{
        const before=new Set(cached.accounts.map(a=>a.id));
        const added=fresh.filter(a=>!before.has(a.id)).length;
        const gone=cached.accounts.filter(a=>!fresh.some(f=>f.id===a.id)).length;
        const bits=[added&&`${added} new`,gone&&`${gone} removed`].filter(Boolean);
        toast(`Account list updated${bits.length?" — "+bits.join(", "):""}`);
      }
    }catch(e){
      if(cached) toast(`Showing saved accounts — refresh failed: ${e.message}`,true);
      else toast("Account discovery failed: "+e.message,true);
    }finally{ setRefreshing(false); }
  }

  const account=accounts.find(a=>a.id===cid);

  async function load(){
    if(!cid){ toast("Pick an account first",true); return; }
    const s=await ensureFresh(session);
    if(!s){ toast("Session expired — sign in again",true); setSession(null); return; }
    setSession(s); setBusy(true); setData(null);
    const body={access_token:s.access_token,customer_id:cid,
      login_customer_id:account?.login_customer_id||"",days:+days,min_clicks:+minClicks};
    try{
      const neg=await post("/api/negatives",body);
      setData(neg);
      toast(`${neg.total_negatives} negatives across ${neg.campaigns.length} campaigns`);
      try{
        const full=await post("/api/triage",body);
        setData(full);
        toast(`Triage complete — ${full.summary.terms_analysed} terms, ${money(full.summary.wasted_spend)} recoverable`);
      }catch(e){ toast("Negatives loaded; triage failed: "+e.message,true); }
    }catch(e){ toast("Load failed: "+e.message,true); }
    finally{ setBusy(false); }
  }

  const s=data?.summary;
  return (<div>
    <header className="top-bar"><div className="hdr">
      <div className="brand">
        <div className="mono-badge">J</div>
        <div><h1>JevAds</h1><p>Negative architecture &amp; search term triage</p></div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        {health&&<span className={"chip "+(health.jev?.reachable?"c-ok":"c-off")}>
          JEV {health.jev?.reachable?"online":"offline"}</span>}
        {health&&<span className="chip c-ok">Ads API {health.google_ads_api}</span>}
        {session
          ? <><div className="user-badge" title={session.email || session.display || "Signed in"}>
                {session.picture ? <img className="user-avatar" src={session.picture} alt="" referrerPolicy="no-referrer" onError={e=>{e.target.style.display="none";}} /> : null}
                {!session.picture && <div className="user-avatar-initials">{((session.name || session.email || "U").trim()[0] || "U").toUpperCase()}</div>}
                <div className="user-info">
                  <span className="user-name">{session.name || (session.email ? session.email.split("@")[0] : "Google User")}</span>
                  {session.email && <span className="user-email">{session.email}</span>}
                </div>
              </div>
              <button className="btn" onClick={()=>{clearAccounts(session);localStorage.removeItem(KEY);location.reload()}}>Sign out</button></>
          : <a className="btn btn-primary" href="/api/auth/login">Sign in with Google</a>}
      </div>
    </div></header>

    <div className="bar"><div className="bar-in">
      <select className="sel" style={{minWidth:300}} value={cid} onChange={e=>setCid(e.target.value)}>
        <option value="">{accounts.length?"— Select an account —":"— Sign in to load accounts —"}</option>
        {accounts.map(a=>(<option key={a.id} value={a.id}>{a.is_manager?"🏢 [MCC] ":"👤 "}{a.label}</option>))}
      </select>
      {session&&(accounts.length>0)&&(
        <span className="cache-note" title={cachedAt?`Account list cached ${new Date(cachedAt).toLocaleString()}`:""}>
          {refreshing
            ? <><span className="spin"></span> checking…</>
            : <>updated {cachedAt?ago(cachedAt):"—"}
                <button className="bare link" title="Re-check Google for account changes"
                  onClick={()=>loadAccounts(session,{quiet:true})}>refresh</button></>}
        </span>)}
      <select className="sel" value={days} onChange={e=>setDays(e.target.value)}>
        {[7,14,30,60,90].map(d=><option key={d} value={d}>Last {d} days</option>)}
      </select>
      <label className="inp-group" title="A term needs at least this many clicks before it is treated as actionable">
        <span>min clicks</span>
        <input type="number" min="0" value={minClicks} onChange={e=>setMinClicks(e.target.value)}/>
      </label>
      <button className="btn btn-primary" onClick={load} disabled={busy||!cid}>
        {busy?<><span className="spin"></span> Loading…</>:"Analyse account"}</button>
      {data&&<input className="inp" style={{minWidth:210,marginLeft:"auto"}} placeholder="Filter keywords / terms…"
        value={query} onChange={e=>setQuery(e.target.value)}/>}
    </div></div>

    <div className="wrap">
      {!data&&!busy&&<div className="empty">
        <div style={{fontSize:"2.6rem"}}>🗂️</div>
        <h3>Negative keyword architecture</h3>
        <p style={{maxWidth:520,margin:"0 auto"}}>
          {session?"Pick an account and run the analysis to see every negative on the account, then triage new search terms against them."
                  :"Sign in with Google to list the Ads accounts you can reach."}
        </p>
      </div>}

      {data&&<>
        <div className="tiles">
          <div className="tile"><div className="k">Total negatives</div><div className="v">{data.total_negatives}</div>
            <div className="s">{data.shared_lists.length} lists · {data.campaign_negatives.length} campaign · {data.adgroup_negatives.length} ad group</div></div>
          <div className="tile"><div className="k">Campaigns</div><div className="v">{data.campaigns.length}</div>
            <div className="s">{data.ad_groups.length} ad groups</div></div>
          {s&&<><div className="tile"><div className="k">Recoverable spend</div>
              <div className="v" style={{color:"var(--red)"}}>{money(s.wasted_spend)}</div>
              <div className="s">across {(s.by_action.ADD_TO_SHARED_LIST||0)+(s.by_action.ADD_CAMPAIGN_NEGATIVE||0)+(s.by_action.ADD_ADGROUP_NEGATIVE||0)} new negatives</div></div>
            <div className="tile"><div className="k">Leaking past negatives</div>
              <div className="v" style={{color:"var(--purple)"}}>{money(s.leaking_spend)}</div>
              <div className="s">{s.by_action.TIGHTEN_EXISTING||0} too-narrow negatives</div></div>
            <div className="tile"><div className="k">Terms analysed</div><div className="v">{s.terms_analysed}</div>
              <div className="s">last {data.days} days</div></div></>}
        </div>

        <div className="tabs">
          <button className={"tab"+(tab==="structure"?" on":"")} onClick={()=>setTab("structure")}>
            Account structure</button>
          <button className={"tab"+(tab==="negatives"?" on":"")} onClick={()=>setTab("negatives")}>
            Negative architecture</button>
          <button className={"tab"+(tab==="triage"?" on":"")} onClick={()=>setTab("triage")}>
            Search term triage {s&&<span className="pill" style={{marginLeft:5}}>{s.terms_analysed}</span>}</button>
        </div>

        {tab==="structure"
          ? <StructureTab data={data} filters={filters} setFilters={setFilters} query={query}/>
          : tab==="negatives"
          ? <NegativesTab data={data} query={query} filters={filters} setFilters={setFilters}/>
          : (data.recommendations
              ? <TriageTab data={data} query={query}/>
              : <div className="empty"><h3>Triage unavailable</h3>
                  <p>The JEV engine did not return recommendations. Check that it is reachable on port 8080.</p></div>)}
      </>}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
