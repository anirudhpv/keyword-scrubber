<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>JevAds Flow — Google Ads Hierarchy & Negative Architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-page: #fbf9f5;
            --bg-surface: #ffffff;
            --bg-subtle: #f4f0e6;
            --bg-muted: #eae3d2;
            
            --ink-primary: #181715;
            --ink-secondary: #57534e;
            --ink-muted: #857f77;
            --ink-faint: #b8b2a7;
            
            --brand-green: #1b4332;
            --brand-green-light: #e8f3ed;
            --brand-green-border: #b7dfc8;
            --brand-forest: #2d6a4f;
            --brand-amber: #d97706;
            --brand-amber-light: #fef3c7;
            --brand-red: #991b1b;
            --brand-red-light: #fef2f2;
            --brand-blue: #1e40af;
            --brand-blue-light: #eff6ff;
            
            --border-subtle: #e7e2d8;
            --border-strong: #d5cebf;
            
            --font-serif: 'Fraunces', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--ink-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header.top-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 24px;
            z-index: 100;
            flex-shrink: 0;
        }
        .header-inner {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-monogram {
            width: 34px;
            height: 34px;
            background: var(--brand-green);
            color: #ffffff;
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .brand-title h1 {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ink-primary);
            line-height: 1.1;
        }
        .brand-title p {
            font-size: 0.68rem;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        .account-bar-strip {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            flex-shrink: 0;
        }

        #flow-root {
            flex: 1;
            position: relative;
            background: #fbf9f5;
            background-image: radial-gradient(#e5dfd3 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: auto;
            padding: 36px;
        }

        .btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            color: var(--ink-primary);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .btn:hover {
            border-color: var(--brand-green);
            color: var(--brand-green);
            background: var(--bg-subtle);
        }
        .btn-primary {
            background: var(--brand-green);
            border-color: var(--brand-green);
            color: #ffffff;
        }
        .btn-primary:hover {
            background: var(--brand-forest);
            color: #ffffff;
        }

        .btn-google {
            background: #ffffff;
            border: 1px solid #d5cebf;
            color: #1f2937;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-google:hover {
            border-color: #4285f4;
            color: #4285f4;
            background: #f8fafc;
        }

        .select-account-dropdown {
            background: var(--bg-page);
            border: 1px solid var(--border-strong);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--ink-primary);
            min-width: 280px;
            outline: none;
        }
        .select-account-dropdown:focus {
            border-color: var(--brand-green);
            background: #ffffff;
        }

        .input-text {
            background: var(--bg-page);
            border: 1px solid var(--border-strong);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: var(--font-mono);
            outline: none;
            color: var(--ink-primary);
        }
        .input-text:focus {
            border-color: var(--brand-green);
            background: #ffffff;
        }

        /* Node Cards */
        .node-account-card {
            background: #ffffff;
            border: 2px solid var(--brand-green);
            border-radius: 12px;
            padding: 18px 22px;
            box-shadow: 0 4px 14px rgba(27, 67, 50, 0.08);
            min-width: 320px;
            max-width: 360px;
        }
        .node-account-title {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--brand-green);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .node-campaign-card {
            background: #ffffff;
            border: 1.5px solid var(--border-strong);
            border-radius: 10px;
            padding: 16px 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            min-width: 300px;
            max-width: 340px;
            transition: all 0.2s;
        }
        .node-campaign-card:hover {
            border-color: var(--brand-green);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        .node-adgroup-card {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            min-width: 260px;
            max-width: 290px;
        }

        .pill-btn {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            user-select: none;
            transition: all 0.15s ease;
        }
        .pill-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .pill-shared { background: var(--brand-blue-light); color: var(--brand-blue); border: 1px solid #bfdbfe; }
        .pill-camp-neg { background: var(--brand-red-light); color: var(--brand-red); border: 1px solid #fecaca; }
        .pill-ag-neg { background: var(--brand-amber-light); color: var(--brand-amber); border: 1px solid #fde68a; }
        .pill-expand { background: var(--brand-green-light); color: var(--brand-green); border: 1px solid var(--brand-green-border); }

        /* Slide-over Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(24, 23, 21, 0.4);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: none;
            justify-content: flex-end;
        }
        .drawer-overlay.active { display: flex; }
        .drawer-panel {
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            height: 100%;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .drawer-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-subtle);
        }
        .drawer-title { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700; }
        .drawer-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--ink-muted); }
        .drawer-content { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
        .drawer-row {
            padding: 10px 14px;
            background: var(--bg-subtle);
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.84rem;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--brand-green);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="header-inner">
        <div class="brand-block">
            <div class="brand-monogram">J</div>
            <div class="brand-title">
                <h1>JevAds Flow</h1>
                <p>Google Ads Hierarchy & Negative Architecture</p>
            </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="/api/auth/login" class="btn btn-google" id="login-btn">
                <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                <span>Sign in with Google</span>
            </a>
            <div id="user-profile-badge" style="display: none; align-items: center; gap: 8px;">
                <span id="user-email-text" style="font-weight: 700; font-size: 0.82rem; color: var(--ink-secondary);"></span>
                <button class="btn" style="padding: 4px 8px; font-size: 0.72rem;" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </div>
</header>

<!-- Account Control Bar -->
<div class="account-bar-strip">
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <select id="account-dropdown" class="select-account-dropdown" onchange="handleAccountDropdownChange()">
            <option value="">— Sign in with Google to load accounts —</option>
            <option value="custom">✏️ Enter Custom Customer ID...</option>
        </select>
        <input type="text" id="custom-cid-input" class="input-text" placeholder="CID: e.g. 552-945-8872" style="display: none; min-width: 180px;">
        <select id="date-select" class="select-account-dropdown" style="min-width: 130px;">
            <option value="30">Last 30 Days</option>
            <option value="60">Last 60 Days</option>
            <option value="90">Last 90 Days</option>
        </select>
        <button class="btn btn-primary" onclick="loadAccountTree()">📊 Load Account Flow</button>
    </div>
    <div style="display: flex; gap: 8px;">
        <button class="btn" onclick="window.expandAllTrees()">Expand All</button>
        <button class="btn" onclick="window.collapseAllTrees()">Collapse All</button>
    </div>
</div>

<div id="flow-root"></div>

<!-- Slide-over Drawer -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer(event)">
    <div class="drawer-panel" onclick="event.stopPropagation()">
        <div class="drawer-header">
            <div>
                <h3 class="drawer-title" id="drawer-title">Inspection Details</h3>
                <span style="font-size: 0.72rem; font-weight: 700; color: var(--ink-muted); text-transform: uppercase;" id="drawer-subtitle">Negatives</span>
            </div>
            <button class="drawer-close" onclick="closeDrawer()">✕</button>
        </div>
        <div class="drawer-content" id="drawer-body"></div>
    </div>
</div>

<div class="toast" id="toast">Data loaded!</div>

<script type="text/babel">
    const { useState, useEffect } = React;
    const AUTH_SESSION_KEY = "jev_ads_auth_session";

    function FlowApp() {
        const [blueprint, setBlueprint] = useState(null);
        const [expandedCamps, setExpandedCamps] = useState({});

        useEffect(() => {
            window.setReactBlueprint = (data) => {
                setBlueprint(data);
                const exp = {};
                (data.campaigns || []).forEach(c => { exp[c.name] = true; });
                setExpandedCamps(exp);
            };

            window.expandAllTrees = () => {
                if (!blueprint) return;
                const exp = {};
                (blueprint.campaigns || []).forEach(c => { exp[c.name] = true; });
                setExpandedCamps(exp);
            };

            window.collapseAllTrees = () => {
                setExpandedCamps({});
            };
        }, [blueprint]);

        if (!blueprint) {
            return (
                <div style={{ textAlign: "center", padding: "100px 20px", color: "var(--ink-muted)" }}>
                    <div style={{ fontSize: "2.4rem", marginBottom: "12px" }}>🌳</div>
                    <h3 style={{ fontFamily: "var(--font-serif)", fontSize: "1.45rem", color: "var(--ink-primary)", marginBottom: "6px" }}>
                        Google Ads Hierarchy & Negative Flow
                    </h3>
                    <p style={{ maxWidth: "480px", margin: "0 auto 20px auto", fontSize: "0.88rem" }}>
                        Sign in with Google above or select an account to render your live campaign tree flow.
                    </p>
                </div>
            );
        }

        const camps = blueprint.campaigns || [];
        const ags = blueprint.ad_groups || [];
        const shared = blueprint.shared_lists || [];
        const campNegs = blueprint.campaign_negatives || [];
        const agNegs = blueprint.adgroup_negatives || [];

        const agsByCamp = {};
        ags.forEach(a => {
            if (!agsByCamp[a.campaign_name]) agsByCamp[a.campaign_name] = [];
            agsByCamp[a.campaign_name].push(a);
        });

        const campNegsByCamp = {};
        campNegs.forEach(cn => {
            if (!campNegsByCamp[cn.campaign_name]) campNegsByCamp[cn.campaign_name] = [];
            campNegsByCamp[cn.campaign_name].push(cn);
        });

        const agNegsByAg = {};
        agNegs.forEach(an => {
            const key = `${an.campaign_name}::${an.ad_group_name}`;
            if (!agNegsByAg[key]) agNegsByAg[key] = [];
            agNegsByAg[key].push(an);
        });

        const sharedByCamp = {};
        shared.forEach(sl => {
            (sl.applied_campaigns || []).forEach(ac => {
                if (!sharedByCamp[ac.campaign_name]) sharedByCamp[ac.campaign_name] = [];
                sharedByCamp[ac.campaign_name].push(sl);
            });
        });

        const toggleCamp = (name) => {
            setExpandedCamps(prev => ({ ...prev, [name]: !prev[name] }));
        };

        return (
            <div style={{ display: "flex", gap: "60px", alignItems: "flex-start", minWidth: "1200px" }}>
                
                {/* 1. ROOT NODE: ACCOUNT */}
                <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
                    <div className="node-account-card">
                        <div className="node-account-title">
                            <span>🏢</span>
                            <span>{blueprint.customer_id ? `CID: ${blueprint.customer_id}` : "Account Root"}</span>
                        </div>
                        <p style={{ fontSize: "0.78rem", color: "var(--ink-muted)", marginBottom: "12px" }}>
                            Google Ads Account Level
                        </p>
                        <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                            <span className="pill-btn pill-shared" onClick={() => window.openDrawerRoot('account_shared', shared)}>
                                📋 {shared.length} Shared Lists
                            </span>
                            <span className="pill-btn pill-expand">
                                📁 {camps.length} Campaigns
                            </span>
                        </div>
                    </div>
                </div>

                {/* 2. COLUMN: CAMPAIGNS NODES */}
                <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>
                    {camps.map(c => {
                        const cAgs = agsByCamp[c.name] || [];
                        const cShared = sharedByCamp[c.name] || [];
                        const cNegs = campNegsByCamp[c.name] || [];
                        const isExpanded = Boolean(expandedCamps[c.name]);

                        return (
                            <div key={c.id || c.name} style={{ display: "flex", gap: "40px", alignItems: "center" }}>
                                
                                <div className="node-campaign-card" style={{ borderColor: isExpanded ? "var(--brand-green)" : "var(--border-strong)" }}>
                                    <div style={{ fontWeight: 700, fontSize: "0.98rem", color: "var(--ink-primary)", marginBottom: "2px" }}>
                                        📁 {c.name}
                                    </div>
                                    <div style={{ fontSize: "0.74rem", color: "var(--ink-muted)", marginBottom: "10px" }}>
                                        {c.type} · Budget: <strong style={{ color: "var(--brand-green)" }}>${(c.budget_daily || 0).toFixed(2)}/day</strong>
                                    </div>

                                    <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                                        <span className="pill-btn pill-shared" onClick={() => window.openDrawerRoot('camp_shared', { name: c.name, lists: cShared })}>
                                            📋 {cShared.length} Lists
                                        </span>
                                        <span className="pill-btn pill-camp-neg" onClick={() => window.openDrawerRoot('camp_negs', { name: c.name, negs: cNegs })}>
                                            🚫 {cNegs.length} Negs
                                        </span>
                                        <span className="pill-btn pill-expand" onClick={() => toggleCamp(c.name)}>
                                            📁 {cAgs.length} Ad Groups {isExpanded ? "◀" : "▶"}
                                        </span>
                                    </div>
                                </div>

                                {/* 3. COLUMN: AD GROUPS */}
                                {isExpanded && (
                                    <div style={{ display: "flex", flexDirection: "column", gap: "10px", paddingLeft: "16px", borderLeft: "2px dashed var(--brand-green-border)" }}>
                                        {cAgs.map(ag => {
                                            const agKey = `${c.name}::${ag.name}`;
                                            const localNegs = agNegsByAg[agKey] || [];
                                            return (
                                                <div key={ag.id || ag.name} className="node-adgroup-card">
                                                    <div style={{ fontWeight: 700, fontSize: "0.85rem", color: "var(--ink-primary)", marginBottom: "2px" }}>
                                                        🎯 {ag.name}
                                                    </div>
                                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "6px" }}>
                                                        <span style={{ fontSize: "0.68rem", color: "var(--ink-muted)" }}>{ag.status}</span>
                                                        <span className="pill-btn pill-ag-neg" onClick={() => window.openDrawerRoot('ag_negs', { agKey, negs: localNegs })}>
                                                            🎯 {localNegs.length} Sculpting Negs
                                                        </span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                            </div>
                        );
                    })}
                </div>

            </div>
        );
    }

    ReactDOM.render(<FlowApp />, document.getElementById('flow-root'));

    let authSession = null;
    let accessibleAccounts = [];

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    function checkAuth() {
        try {
            const raw = localStorage.getItem(AUTH_SESSION_KEY);
            if (raw) {
                authSession = JSON.parse(raw);
                if (authSession && authSession.access_token && authSession.expires_at > Date.now()) {
                    document.getElementById('login-btn').style.display = 'none';
                    document.getElementById('user-profile-badge').style.display = 'flex';
                    document.getElementById('user-email-text').textContent = authSession.display || authSession.name || authSession.email || 'Authenticated User';
                    fetchAccessibleAccounts();
                }
            }
        } catch(e) {}
    }

    async function fetchAccessibleAccounts() {
        if (!authSession || !authSession.access_token) return;
        const dropdown = document.getElementById('account-dropdown');
        dropdown.innerHTML = `<option value="">⏳ Loading accessible accounts...</option>`;

        try {
            const resp = await fetch("/api/google-ads/accounts", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ access_token: authSession.access_token })
            });
            const data = await resp.json();
            if (resp.ok && data.accounts && data.accounts.length > 0) {
                accessibleAccounts = data.accounts;
                let opts = accessibleAccounts.map(a => {
                    const prefix = a.is_manager ? '🏢 [MCC]' : '👤';
                    return `<option value="${a.id}" data-manager="${a.manager_id || ''}">${prefix} ${a.name}</option>`;
                }).join('');
                opts += `<option value="custom">✏️ Enter Customer ID manually...</option>`;
                dropdown.innerHTML = opts;
                showToast(`Loaded ${accessibleAccounts.length} accounts!`);
            } else {
                const errDetail = data?.details?.error?.message || data?.error || (resp.status === 401 ? "401 Unauthorized: Developer Token or OAuth Scope required" : "No accessible accounts found");
                console.warn("Account Discovery Error:", data);
                dropdown.innerHTML = `
                    <option value="">— ${errDetail} —</option>
                `;
                showToast(errDetail, "error");
            }
        } catch(e) {
            console.error("Fetch Accounts Network Error:", e);
            dropdown.innerHTML = `
                <option value="">— Network Error: Failed to load accounts —</option>
            `;
            showToast("Network Error loading accounts", "error");
        }
    }

    function handleAccountDropdownChange() {
        const sel = document.getElementById('account-dropdown');
        const customInp = document.getElementById('custom-cid-input');
        if (sel.value === 'custom') {
            customInp.style.display = 'inline-block';
            customInp.focus();
        } else {
            customInp.style.display = 'none';
        }
    }

    async function loadAccountTree() {
        const sel = document.getElementById('account-dropdown');
        let cid = sel.value;
        let managerId = '';

        if (cid === 'custom') {
            cid = document.getElementById('custom-cid-input').value.trim().replace(/-/g, '');
        }

        const selectedOpt = sel.options[sel.selectedIndex];
        if (selectedOpt && selectedOpt.dataset.manager) {
            managerId = selectedOpt.dataset.manager;
        }

        if (!cid) {
            alert("Please select an account from the dropdown or enter a Customer ID!");
            return;
        }

        const days = document.getElementById('date-select').value;
        showToast(`Loading live hierarchy for CID: ${cid}...`);

        const token = (authSession && authSession.access_token) ? authSession.access_token : null;

        try {
            const resp = await fetch("/api/google-ads/study", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    access_token: token,
                    customer_id: cid,
                    manager_id: managerId,
                    days: parseInt(days)
                })
            });
            const res = await resp.json();
            if (res.data && res.data.campaigns) {
                window.setReactBlueprint(res.data);
                showToast(`✅ Loaded ${res.data.campaigns.length} campaigns into React Flow!`);
                return;
            } else if (res.error) {
                alert(`Google Ads Notice: ${res.error}\n\n${JSON.stringify(res.details || '')}`);
            }
        } catch(e) {
            alert("API Error loading account tree: " + e.message);
        }
    }

    function logout() {
        localStorage.removeItem(AUTH_SESSION_KEY);
        window.location.reload();
    }

    window.openDrawerRoot = (type, data) => {
        const overlay = document.getElementById('drawer-overlay');
        const title = document.getElementById('drawer-title');
        const subtitle = document.getElementById('drawer-subtitle');
        const body = document.getElementById('drawer-body');

        overlay.classList.add('active');

        if (type === 'account_shared') {
            title.textContent = "Account Shared Negative Lists";
            subtitle.textContent = "Shared Library Sets";
            body.innerHTML = data.map(sl => `
                <div class="drawer-row">
                    <div>
                        <strong>📋 ${sl.name}</strong>
                        <div style="font-size: 0.72rem; color: var(--ink-muted);">Applied to ${(sl.applied_campaigns || []).length} campaigns</div>
                    </div>
                    <span style="font-weight: 700; color: var(--brand-red);">${sl.member_count} keywords</span>
                </div>
            `).join('') || '<div>No shared lists.</div>';
        }
        else if (type === 'camp_shared') {
            title.textContent = "Attached Shared Lists";
            subtitle.textContent = data.name;
            body.innerHTML = data.lists.map(sl => `
                <div class="drawer-row">
                    <strong>📋 ${sl.name}</strong>
                    <span>${sl.member_count} keywords</span>
                </div>
            `).join('') || '<div style="color: var(--ink-muted);">No shared lists attached to this campaign.</div>';
        }
        else if (type === 'camp_negs') {
            title.textContent = "Campaign Negative Keywords";
            subtitle.textContent = data.name;
            body.innerHTML = data.negs.map(cn => `
                <div class="drawer-row">
                    <span style="font-family: var(--font-mono); font-weight: 700; color: var(--brand-red);">${cn.keyword}</span>
                    <span style="font-size: 0.68rem; font-weight: 800; background: #ffffff; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border-subtle);">${cn.match_type}</span>
                </div>
            `).join('') || '<div style="color: var(--ink-muted);">No explicit campaign negatives.</div>';
        }
        else if (type === 'ag_negs') {
            title.textContent = "Ad Group Sculpting Negatives";
            subtitle.textContent = data.agKey;
            body.innerHTML = data.negs.map(an => `
                <div class="drawer-row">
                    <span style="font-family: var(--font-mono); font-weight: 700; color: var(--brand-amber);">${an.keyword}</span>
                    <span style="font-size: 0.68rem; font-weight: 800; background: #ffffff; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border-subtle);">${an.match_type}</span>
                </div>
            `).join('') || '<div style="color: var(--ink-muted);">No local sculpting negatives.</div>';
        }
    };

    function closeDrawer() {
        document.getElementById('drawer-overlay').classList.remove('active');
    }

    checkAuth();
</script>
</body>
</html>
